# ALSTM 选股 + PPO 择时 · 中证 1000
#
# 风控参数不在这里 —— 走全局 config/config.yaml 的 risk 段，
# 回测与实盘共用同一份，避免两边漂移。

market: csi1000
index: "000852.SH"

# 持仓只数。回测用 30，但实盘 50 万 × 30% 仓位分 30 只 = 每只约 5000 元，
# 股价超 50 元的票连 1 手都买不起会被跳过 —— 整手规则回测没模拟。
# 降到 10 只让每只分到约 15000 元，绝大多数票能买满整手。
hold_k: 10

# 调仓周期（交易日）。PPO 训练时按 20 天调仓，改这个值等于换了策略，
# 必须重跑回测
rebalance_days: 20

capital: 500000
