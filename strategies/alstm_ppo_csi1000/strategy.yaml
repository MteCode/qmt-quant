# ALSTM 选股 + PPO 择时 · 中证 1000
#
# 风控参数不在这里 —— 走全局 config/config.yaml 的 risk 段，
# 回测与实盘共用同一份，避免两边漂移。

market: csi1000
index: "000852.SH"

# 持仓只数。回测用 30，但实盘 50 万 × 30% 仓位分 30 只 = 每只约 5000 元，
# 股价超 50 元的票连 1 手都买不起会被跳过 —— 整手规则回测没模拟。
# 降到 10 只让每只分到约 15000 元，绝大多数票能买满整手。
hold_k: 10

# 调仓周期（交易日）。每日调仓 = 短线轮动。
# 注意：PPO 原先按 20 天训练，改为 1 后 PPO 择时不再匹配，
# 应尽快重训 PPO（--rebalance-days 1）
rebalance_days: 1

# 最大持仓天数。超过此天数的持仓强制卖出，即使信号仍在推荐。
# 0 = 不限制
max_hold_days: 3

capital: 200000
