# 四层选股系统 · 中证 1000
#
# 风控参数不在这里 —— 走全局 config/config.yaml 的 risk 段，
# 回测与实盘共用同一份，避免两边漂移。

market: csi1000
index: "000852.SH"

# 第 1 层输出的候选池大小。远大于最终持仓，给第 2 层留剔除空间
candidate_k: 100

# 最终持仓只数。50 万本金 / 30 只 = 每只约 1.6 万，
# 按 30% 仓位算每只约 5000 元 —— 股价超 50 元的买不满一手。
# 实盘用 hold_k=10 让每只分到约 1.5 万
hold_k: 30

# 调仓周期（交易日）。改这个值等于换了策略，必须重跑全套检验
rebalance_days: 20

capital: 500000
