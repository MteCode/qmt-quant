# qmtquant 配置模板
# 使用方式：复制为 config/config.yaml 后填入真实值。
# config.yaml 已在 .gitignore 中，不会入库 —— 资金账号绝不要提交。

log_level: INFO

gateway:
  # sim = 本地模拟撮合（联调用）; miniqmt = 真实/模拟券商通道; amt = 国金算法通道
  name: sim
  # miniQMT 数据目录，注意是 userdata_mini 而不是安装根目录。
  # 用正斜杠 —— Windows 同样识别，且避免 YAML 双引号里 \q \u 被当成转义符报错。
  qmt_path: 'D:/qmtApp/userdata_mini'
  account_id: ""            # 资金账号
  account_type: STOCK       # STOCK / CREDIT(两融)
  reconnect_max_retry: 10
  reconnect_base_delay: 2.0

data:
  provider: xt              # xt / csv
  store_dir: "./data"
  # 回测必须用 back(后复权)。
  # 前复权是从当前价往回减累计分红，高分红股会算出负价格 ——
  # 实测 601919 中远海控前复权最低 -5.14 元，300 只里有 7 只共 851 根 K 线为负，
  # 负价格会让均线、收益率、仓位计算全部失效且不报错。
  # 后复权从上市价往后累乘，永不为负，且收益率含分红再投，是回测的正确口径。
  # 注意：实盘下单价格用行情推送的真实价（天然不复权），不受此项影响。
  dividend_type: back       # back(后复权) / front(前复权) / none(不复权)
  default_interval: 1d

cost:
  commission_rate: 0.00025  # 佣金万 2.5，按你实际费率改
  commission_min: 5.0
  stamp_tax_rate: 0.001     # 印花税千 1，仅卖出
  transfer_fee_rate: 0.00001
  slippage_tick: 1

# 风控为硬约束，策略无法绕过。首次实盘务必把额度调到很小。
risk:
  max_order_value: 50000            # 单笔委托金额上限
  max_position_ratio: 0.20          # 单票市值占总资产上限
  max_total_position_ratio: 0.95    # 总仓位上限
  max_order_count_per_day: 200
  max_turnover_per_day: 1000000
  daily_loss_limit_ratio: 0.03      # 当日亏 3% 转入只平不开
  forbid_st: true
  blacklist: []                     # 如 ["000001.SZSE"]

backtest:
  start: "2021-01-01"
  end: "2024-12-31"
  initial_capital: 1000000
  interval: 1d
  benchmark: "000300.SSE"

notify:
  enabled: false
  channel: wecom            # wecom / dingtalk
  webhook: ""               # 机器人 webhook，属于 secret，勿提交

strategies:
  - name: MaCrossDemo
    class: qmtquant.strategy.examples.ma_cross.MaCrossStrategy
    vt_symbols:
      - "000001.SZSE"
    setting:
      fast_window: 5
      slow_window: 20
      position_ratio: 0.95
