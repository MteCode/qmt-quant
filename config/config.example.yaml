# qmtquant 配置模板
# 使用方式：复制为 config/config.yaml 后填入真实值。
# config.yaml 已在 .gitignore 中，不会入库 —— 资金账号绝不要提交。

log_level: INFO

gateway:
  # sim = 本地模拟撮合（联调用）; miniqmt = 真实/模拟券商通道; amt = 国金算法通道
  name: sim
  # miniQMT 数据目录，注意是 userdata_mini 而不是安装根目录。
  # 用正斜杠 —— Windows 同样识别，且避免 YAML 双引号里 \q \u 被当成转义符报错。
  qmt_path: 'D:/qmtApp/userdata_mini'
  account_id: ""            # 资金账号
  account_type: STOCK       # STOCK / CREDIT(两融)
  reconnect_max_retry: 10
  reconnect_base_delay: 2.0

data:
  provider: xt              # xt / csv
  store_dir: "./data"
  # 回测必须用 back(后复权)。
  # 前复权是从当前价往回减累计分红，高分红股会算出负价格 ——
  # 实测 601919 中远海控前复权最低 -5.14 元，300 只里有 7 只共 851 根 K 线为负，
  # 负价格会让均线、收益率、仓位计算全部失效且不报错。
  # 后复权从上市价往后累乘，永不为负，且收益率含分红再投，是回测的正确口径。
  # 注意：实盘下单价格用行情推送的真实价（天然不复权），不受此项影响。
  dividend_type: back       # back(后复权) / front(前复权) / none(不复权)
  default_interval: 1d

cost:
  commission_rate: 0.00025  # 佣金万 2.5，按你实际费率改
  commission_min: 5.0
  stamp_tax_rate: 0.001     # 印花税千 1，仅卖出
  transfer_fee_rate: 0.00001
  slippage_tick: 1

# 风控为硬约束，策略无法绕过。首次实盘务必把额度调到很小。
risk:
  max_order_value: 50000            # 单笔委托金额上限
  max_position_ratio: 0.20          # 单票市值占总资产上限
  max_total_position_ratio: 0.95    # 总仓位上限
  max_order_count_per_day: 200
  max_turnover_per_day: 1000000
  daily_loss_limit_ratio: 0.03      # 当日亏 3% 转入只平不开
  forbid_st: true
  blacklist: []                     # 如 ["000001.SZSE"]

  # 回撤控制：看的是从峰值算起的累计跌幅，覆盖「连续阴跌」盲区。
  # 每天亏 1% 连亏 20 天累计 18%，一次都不会触及上面的 3% 日亏线。
  #
  # ⚠ 阈值太紧会导致永久停摆：降档要求回撤收复到 阈值×recovery_ratio 以下，
  #   策略若长期在回撤中就再也开不了新仓。
  #   经验法则：一档阈值 >= 策略年化波动率 × 0.5。
  #   实测动量轮动（年化波动 27.72%）用 10% 一档线，成交从 438 笔降到 26 笔。
  drawdown_enabled: true
  drawdown_close_only: 0.10         # 一档：停止开新仓
  drawdown_reduce: 0.15             # 二档：强制减仓
  drawdown_reduce_keep: 0.5         # 二档保留的仓位比例
  drawdown_flat: 0.20               # 三档：全部平仓
  drawdown_recovery_ratio: 0.7      # 降档迟滞：收复到 阈值×0.7 以下才降档
  drawdown_min_observations: 20     # 攒够观测点才生效，避免启动时误触发
  # 最长冻结期（观测点数），0=禁用。在非正常档位停留超过该数后，
  # 重置峰值为当前净值并恢复交易 —— 承认旧峰值已不可及。
  # ⚠ 会削弱保护：持续亏损的策略会不断获得「新起点」，
  #   每次重置都让它有机会再亏一个完整阈值幅度。建议 >= 60。
  drawdown_max_freeze: 0

backtest:
  start: "2021-01-01"
  end: "2024-12-31"
  initial_capital: 1000000
  interval: 1d
  benchmark: "000300.SSE"

notify:
  enabled: false
  channel: wecom            # wecom / dingtalk
  webhook: ""               # 机器人 webhook，属于 secret，勿提交

strategies:
  - name: MaCrossDemo
    class: qmtquant.strategy.ma_cross.MaCrossStrategy
    vt_symbols:
      - "000001.SZSE"
    setting:
      fast_window: 5
      slow_window: 20
      position_ratio: 0.95

# Tushare Pro 数据源（2000 积分档 / 200 元每年）
# 补 QMT 拿不到的两样东西：历史指数成分股、逐日估值因子
tushare:
  # 建议留空，改用环境变量 TUSHARE_TOKEN —— 这样即使误提交也不会泄露
  token: ""
  calls_per_minute: 200   # 本地限流，防止批量下载触发官方风控
  max_retry: 3
  retry_base_delay: 2.0
